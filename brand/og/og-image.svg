<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="aura">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&display=swap');
      .wm { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; }
      .ac { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; }
    </style>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1F4A54"/>
      <stop offset="100%" stop-color="#0F2A30"/>
    </radialGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#E8B86D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E8B86D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top meta -->
  <text x="80" y="80" class="mono" font-size="20" fill="#B8B0A0" letter-spacing="3">A COMMAND-LINE INTERFACE, REIMAGINED</text>

  <!-- Wordmark -->
  <text x="80" y="380" class="wm" font-size="280" fill="#F2EDE0" letter-spacing="-10">aur<tspan class="ac" fill="#E8B86D">a</tspan></text>

  <!-- Bottom tagline -->
  <text x="80" y="500" class="mono" font-size="24" fill="#B8B0A0">type faster. ship calmer.</text>

  <!-- Corner mark -->
  <text x="1120" y="580" class="mono" font-size="16" fill="#7A7468" text-anchor="end">aura · v0.9.2 · 2026</text>
</svg>
