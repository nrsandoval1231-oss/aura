<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="aura mark">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap');
      .ac { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; }
    </style>
  </defs>
  <!-- Concentric ring mark inspired by "a" letterform with breath -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#E8B86D" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="100" r="64" fill="none" stroke="#E8B86D" stroke-width="1.5" opacity="0.7"/>
  <text x="100" y="138" class="ac" font-size="120" fill="#E8B86D" text-anchor="middle">a</text>
</svg>
