[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.0.0"
description = "Local-first evidence-governed engineering runtime"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Nick Sandoval" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typesafe-sdk>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
forge = "forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

# Default rules plus import sorting and pyupgrade. E501 is deliberately not
# enabled: the core modules predate a line-length gate and reformatting them
# would bury real diffs in mechanical churn. Revisit as its own packet.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
