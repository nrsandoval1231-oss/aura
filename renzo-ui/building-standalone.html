<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Renzo — Atelier Design System
   After Renzo Piano. Warm ivory, classic gold, EB Garamond.
   ========================================================================== */

:root {
  --ivory: #FAF7F2;
  --ivory-deep: #F4EFE6;
  --champagne: #E9E3D6;
  --champagne-light: #DCD6CD;
  --gold: #B8941F;
  --gold-soft: #D4AF37;
  --brown: #2E2A24;
  --brown-soft: #4A4642;
  --gray-warm: #8A8275;
  --gray-soft: #A69C92;
  --gray-ghost: #C7BFBA;
  --white-soft: rgba(255, 255, 255, 0.55);
  --line: rgba(74, 70, 66, 0.12);
  --line-strong: rgba(74, 70, 66, 0.22);

  /* Type */
  --font-serif: 'EB Garamond', 'Georgia', 'Times New Roman', serif;
  --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--ivory);
  color: var(--brown);
  font-family: var(--font-serif);
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
button { background: none; border: none; color: inherit; font: inherit; cursor: pointer; padding: 0; }
input { background: none; border: none; outline: none; color: inherit; font: inherit; font-family: inherit; }
a { color: inherit; text-decoration: none; }

/* ====== Background texture (paper + corner ornaments) ====== */
.paper {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(circle at 25% 30%, rgba(212, 175, 55, 0.025), transparent 50%),
    radial-gradient(circle at 75% 70%, rgba(184, 148, 31, 0.02), transparent 50%);
}
.corner { position: fixed; width: 28px; height: 28px; pointer-events: none; z-index: 5; }
.corner::before, .corner::after { content: ''; position: absolute; background: var(--gold-soft); }
.corner-tl { top: 28px; left: 28px; }
.corner-tl::before { top: 0; left: 0; width: 28px; height: 1px; }
.corner-tl::after { top: 0; left: 0; width: 1px; height: 28px; }
.corner-tr { top: 28px; right: 28px; }
.corner-tr::before { top: 0; right: 0; width: 28px; height: 1px; }
.corner-tr::after { top: 0; right: 0; width: 1px; height: 28px; }
.corner-bl { bottom: 28px; left: 28px; }
.corner-bl::before { bottom: 0; left: 0; width: 28px; height: 1px; }
.corner-bl::after { bottom: 0; left: 0; width: 1px; height: 28px; }
.corner-br { bottom: 28px; right: 28px; }
.corner-br::before { bottom: 0; right: 0; width: 28px; height: 1px; }
.corner-br::after { bottom: 0; right: 0; width: 1px; height: 28px; }

/* ====== Topbar ====== */
.topbar {
  position: relative; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: 24px 56px;
}
.brand { display: inline-flex; align-items: baseline; gap: 12px; }
.brand-mark {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 22px;
  color: var(--brown);
  letter-spacing: 0.04em;
}
.brand-mark::after { content: '·'; margin-left: 12px; color: var(--gold-soft); font-weight: 400; }
.brand-sub {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--gray-warm);
  text-transform: uppercase;
  font-weight: 500;
}
.topbar-nav {
  display: flex; gap: 36px;
  font-family: var(--font-sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gray-warm);
}
.topbar-nav a {
  transition: color 0.2s;
  padding: 4px 0;
  border-bottom: 1px solid transparent;
}
.topbar-nav a:hover { color: var(--brown); border-bottom-color: var(--gold-soft); }
.topbar-nav a.active { color: var(--brown); border-bottom-color: var(--gold-soft); }
.topbar-right {
  display: inline-flex; align-items: center; gap: 20px;
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--gray-warm);
  letter-spacing: 0.06em;
}
.topbar-page {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 13px;
  color: var(--gold);
}

/* ====== Gold hairline rule (with end-caps) ====== */
.rule {
  width: 56px;
  height: 1px;
  background: var(--gold-soft);
  margin: 0 auto;
  position: relative;
}
.rule::before, .rule::after {
  content: ''; position: absolute;
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--gold-soft);
  top: -1px;
}
.rule::before { left: -8px; }
.rule::after { right: -8px; }

/* ====== Eyebrow ====== */
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 500;
}
.eyebrow::before, .eyebrow::after {
  content: ''; width: 24px; height: 1px;
  background: var(--gold-soft);
  opacity: 0.7;
}

/* ====== CTA ====== */
.cta {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 18px;
  color: var(--brown);
  border-bottom: 1px solid var(--gold-soft);
  padding-bottom: 4px;
  transition: all 0.2s;
}
.cta:hover { color: var(--gold); border-bottom-color: var(--gold); }
.cta-arrow { font-family: var(--font-sans); font-size: 14px; transition: transform 0.2s; }
.cta:hover .cta-arrow { transform: translateX(3px); }
.cta-secondary {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 16px;
  color: var(--gray-warm);
  border-bottom: 1px solid transparent;
  padding-bottom: 4px;
  transition: color 0.2s;
}
.cta-secondary:hover { color: var(--brown); }

/* ====== Page footer ====== */
.page-foot {
  position: relative; z-index: 1;
  border-top: 1px solid var(--line);
  padding: 28px 56px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--gray-soft);
  text-transform: uppercase;
}
.page-foot .italic {
  font-family: var(--font-serif);
  font-style: italic;
  text-transform: none;
  letter-spacing: 0;
  color: var(--gold);
  font-size: 13px;
}

/* ====== Page-turn motion (added via renzo.js) ====== */
.page-turn-out {
  animation: turnOut 0.5s ease forwards;
}
.page-turn-in {
  animation: turnIn 0.6s ease forwards;
}
@keyframes turnOut {
  0% { opacity: 1; transform: translateX(0); filter: blur(0); }
  100% { opacity: 0; transform: translateX(-30px); filter: blur(2px); }
}
@keyframes turnIn {
  0% { opacity: 0; transform: translateX(30px); filter: blur(2px); }
  100% { opacity: 1; transform: translateX(0); filter: blur(0); }
}

/* Subtle fade-up on load */
.rise {
  opacity: 0;
  transform: translateY(8px);
  animation: rise 0.9s ease forwards;
}
.rise-1 { animation-delay: 0.05s; }
.rise-2 { animation-delay: 0.2s; }
.rise-3 { animation-delay: 0.35s; }
.rise-4 { animation-delay: 0.5s; }
@keyframes rise {
  to { opacity: 1; transform: translateY(0); }
}

/* ====== Manifesto page ====== */
.manifesto {
  position: relative; z-index: 1;
  max-width: 760px;
  margin: 0 auto;
  padding: 60px 24px 40px;
}
.m-hero { text-align: center; margin-bottom: 120px; }
.m-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 40px;
}
.m-eyebrow svg { color: var(--gold-soft); }
.m-h1 {
  font-family: var(--font-serif);
  font-size: clamp(44px, 6vw, 68px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.015em;
  margin-bottom: 40px;
  color: var(--brown);
}
.m-h1 em { font-style: italic; color: var(--brown-soft); }
.m-h1 .gold { font-style: italic; color: var(--gold); }
.m-meta {
  display: inline-flex; gap: 14px;
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--gray-soft);
  text-transform: uppercase;
  font-weight: 500;
}
.m-meta .dot { color: var(--gold-soft); }

.m-section { margin-bottom: 100px; }
.m-section-num {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 16px;
  color: var(--gold);
  margin-bottom: 12px;
  letter-spacing: 0.05em;
}
.m-h2 {
  font-family: var(--font-serif);
  font-size: clamp(28px, 3vw, 36px);
  font-weight: 400;
  font-style: italic;
  color: var(--brown);
  margin-bottom: 32px;
  letter-spacing: -0.005em;
}
.m-prose p {
  font-family: var(--font-serif);
  font-size: 17px;
  line-height: 1.7;
  color: var(--brown-soft);
  margin-bottom: 20px;
}
.m-prose em { font-style: italic; color: var(--brown); }
.m-lede {
  font-size: 22px !important;
  line-height: 1.55 !important;
  color: var(--brown) !important;
  font-style: italic;
  padding-left: 24px;
  border-left: 1px solid var(--gold-soft);
  margin: 32px 0 !important;
}
.m-figure {
  margin: 40px 0;
  text-align: center;
}
.m-svg {
  width: 100%;
  max-width: 560px;
  height: auto;
}
.m-figure figcaption {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 13px;
  color: var(--gray-warm);
  margin-top: 12px;
  letter-spacing: 0.005em;
}

.m-pullquote {
  text-align: center;
  padding: 60px 20px;
  margin: 80px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  position: relative;
}
.m-pq-mark {
  color: var(--gold-soft);
  opacity: 0.5;
  margin-bottom: 16px;
}
.m-pullquote p {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: clamp(22px, 2.5vw, 30px);
  color: var(--brown);
  line-height: 1.4;
  font-weight: 400;
}

.m-signoff {
  display: flex; flex-direction: column; align-items: center; gap: 24px;
  padding: 40px 0;
  margin: 60px 0;
}
.m-signoff-rule {
  width: 56px; height: 1px;
  background: var(--gold-soft);
}
.m-signoff-body { text-align: center; }
.m-signoff-line {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 18px;
  color: var(--brown-soft);
  margin-bottom: 8px;
}
.m-signoff-name {
  font-family: var(--font-serif);
  font-size: 36px;
  color: var(--brown);
  font-weight: 500;
  letter-spacing: 0.02em;
  margin-bottom: 4px;
}
.m-signoff-meta {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--gray-soft);
  text-transform: uppercase;
  font-weight: 500;
}

.m-end {
  text-align: center;
  padding: 60px 0 40px;
}
.m-end-h {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 32px;
  color: var(--brown);
  margin-bottom: 12px;
  font-weight: 400;
  letter-spacing: -0.005em;
}
.m-end-sub {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 17px;
  color: var(--gray-warm);
  margin-bottom: 32px;
}
.m-end-actions {
  display: flex; gap: 24px; justify-content: center; align-items: center;
}

/* ====== Cronache page ====== */
.cronache {
  position: relative; z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 60px 24px 40px;
}
.c-hero { text-align: center; margin-bottom: 80px; }
.c-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 32px;
}
.c-eyebrow svg { color: var(--gold-soft); }
.c-h1 {
  font-family: var(--font-serif);
  font-size: clamp(40px, 5vw, 56px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.015em;
  margin-bottom: 24px;
  color: var(--brown);
}
.c-h1 em { font-style: italic; color: var(--brown-soft); }
.c-h1 .gold { font-style: italic; color: var(--gold); }
.c-sub {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 17px;
  color: var(--gray-warm);
  max-width: 540px;
  margin: 0 auto;
  line-height: 1.55;
}

.c-month {
  display: flex; align-items: center; gap: 16px;
  padding: 24px 0 16px;
}
.c-month-name {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--brown);
  text-transform: uppercase;
  font-weight: 600;
}
.c-month-rule {
  flex: 1;
  height: 1px;
  background: var(--line);
}
.c-month-count {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--gray-warm);
  text-transform: uppercase;
  font-weight: 500;
}

.c-entry {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  gap: 24px;
  align-items: start;
  padding: 24px 0;
  border-bottom: 1px solid var(--line);
  transition: background 0.3s ease;
}
.c-entry:hover { background: rgba(212, 175, 55, 0.03); }
.c-entry-date {
  text-align: center;
  padding-top: 4px;
}
.c-day {
  display: block;
  font-family: var(--font-serif);
  font-size: 36px;
  font-weight: 400;
  color: var(--brown);
  line-height: 1;
  letter-spacing: -0.01em;
}
.c-month-abbr {
  display: block;
  font-family: var(--font-sans);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--gold);
  margin-top: 4px;
  font-weight: 600;
}
.c-entry-head {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.c-entry-title {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 500;
  color: var(--brown);
  font-style: italic;
  letter-spacing: 0.005em;
}
.c-entry-tag {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--gray-warm);
  text-transform: uppercase;
  font-weight: 500;
  padding: 2px 8px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.c-entry-desc {
  font-family: var(--font-serif);
  font-size: 15px;
  line-height: 1.6;
  color: var(--brown-soft);
  margin-bottom: 12px;
  max-width: 520px;
}
.c-entry-foot {
  display: flex; gap: 10px; align-items: center;
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--gray-soft);
  text-transform: uppercase;
  font-weight: 500;
}
.c-entry-foot .c-dot { color: var(--gold-soft); }
.c-entry-foot .c-mood { font-style: italic; font-family: var(--font-serif); font-size: 12px; color: var(--brown-soft); text-transform: lowercase; letter-spacing: 0; }
.c-entry-mark {
  color: var(--gold-soft);
  opacity: 0.6;
  padding-top: 4px;
}

.c-legend {
  margin-top: 60px;
  padding: 32px 36px;
  background: var(--white-soft);
  border: 1px solid var(--line);
  border-radius: 2px;
}
.c-legend-h {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 16px;
  color: var(--gold);
  margin-bottom: 20px;
  letter-spacing: 0.02em;
  text-align: center;
}
.c-legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px 32px;
}
.c-legend-item {
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 16px;
  align-items: baseline;
  padding: 8px 0;
  border-top: 1px dashed var(--line);
}
.c-legend-key {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  color: var(--brown);
  text-transform: uppercase;
  font-weight: 600;
}
.c-legend-val {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 14px;
  color: var(--gray-warm);
}

/* ====== Empty (first visit) page ====== */
.empty {
  position: relative; z-index: 1;
  max-width: 880px;
  margin: 0 auto;
  padding: 60px 24px 40px;
}
.e-hero { text-align: center; margin-bottom: 100px; }
.e-eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 32px;
}
.e-eyebrow svg { color: var(--gold-soft); }
.e-h1 {
  font-family: var(--font-serif);
  font-size: clamp(44px, 6vw, 64px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.015em;
  margin-bottom: 32px;
  color: var(--brown);
}
.e-h1 em { font-style: italic; color: var(--brown-soft); }
.e-h1 .gold { font-style: italic; color: var(--gold); }
.e-sub {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 17px;
  color: var(--gray-warm);
  max-width: 540px;
  margin: 0 auto;
  line-height: 1.55;
}

.e-three { margin-bottom: 80px; }
.e-three-rule {
  width: 56px; height: 1px;
  background: var(--gold-soft);
  margin: 0 auto 48px;
  position: relative;
}
.e-three-rule::before, .e-three-rule::after {
  content: ''; position: absolute;
  width: 3px; height: 3px;
  border-radius: 50%;
  background: var(--gold-soft);
  top: -1px;
}
.e-three-rule::before { left: -8px; }
.e-three-rule::after { right: -8px; }
.e-three-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--line);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.e-three-cell {
  background: var(--ivory);
  padding: 36px 28px;
  text-align: center;
}
.e-three-num {
  display: block;
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 18px;
  color: var(--gold);
  margin-bottom: 16px;
}
.e-three-h {
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 500;
  color: var(--brown);
  margin-bottom: 14px;
  font-style: italic;
}
.e-three-p {
  font-family: var(--font-serif);
  font-size: 15px;
  color: var(--brown-soft);
  line-height: 1.55;
}

.e-suggestions { margin-bottom: 80px; }
.e-suggestions-head { text-align: center; margin-bottom: 32px; }
.e-suggestions-eyebrow {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--gold);
  text-transform: uppercase;
  font-weight: 500;
  position: relative;
  display: inline-block;
  padding: 0 32px;
}
.e-suggestions-eyebrow::before, .e-suggestions-eyebrow::after {
  content: ''; position: absolute;
  top: 50%; width: 24px; height: 1px;
  background: var(--gold-soft);
  opacity: 0.7;
}
.e-suggestions-eyebrow::before { left: 0; }
.e-suggestions-eyebrow::after { right: 0; }
.e-suggestions-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.e-suggestion {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 18px 22px;
  background: var(--white-soft);
  border: 1px solid var(--line);
  border-radius: 2px;
  text-align: left;
  font: inherit;
  cursor: pointer;
  transition: all 0.25s ease;
}
.e-suggestion:hover {
  background: rgba(212, 175, 55, 0.06);
  border-color: var(--gold-soft);
  transform: translateY(-1px);
}
.e-suggestion-mark {
  color: var(--gold);
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 4px;

}

/* ====== Home / Building / Done / Landing — shared stage ====== */
.stage {
  position: relative; z-index: 1;
  min-height: calc(100vh - 100px);
  display: grid;
  grid-template-rows: 1fr auto;
  padding: 40px 56px 56px;
}
.centerpiece {

  text-align: center;
  max-width: 760px;
  margin: 0 auto;
  padding: 60px 0;
}
.question {
  font-family: var(--font-serif);
  font-size: clamp(40px, 5.5vw, 64px);
  font-weight: 400;
  line-height: 1.1;
  letter-spacing: -0.01em;
  color: var(--brown);
  margin-bottom: 18px;
}
.question .italic { font-style: italic; color: var(--brown-soft); }
.subhead {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 18px;
  color: var(--gray-warm);
  margin-bottom: 56px;
  font-weight: 400;
  letter-spacing: 0.005em;
}
.field { width: 100%; max-width: 560px; margin: 0 auto; position: relative; }
.field-input {
  width: 100%;
  padding: 18px 20px;
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 400;
  color: var(--brown);
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--gray-ghost);
  text-align: center;
  letter-spacing: 0.01em;
  transition: all 0.3s ease;
}
.field-input::placeholder { color: var(--gray-soft); font-style: italic; }
.field-input:focus { border-bottom-color: var(--gold); }
.field-input:focus::placeholder { color: transparent; }
.field-line {
  position: absolute;
  left: 50%; bottom: 0;
  width: 0; height: 1px;
  background: var(--gold);
  transition: all 0.4s ease;
  transform: translateX(-50%);
}
.field-input:focus ~ .field-line,
.field:focus-within .field-line { width: 100%; }

.submit {
  margin-top: 48px;
  display: inline-flex; align-items: center; gap: 12px;
  font-family: var(--font-serif);
  font-size: 16px;
  font-style: italic;
  color: var(--brown);
  border-bottom: 1px solid var(--gold-soft);
  padding-bottom: 4px;

  background: none;

}
.submit:hover { color: var(--gold); border-bottom-color: var(--gold); }
.submit-arrow { font-family: var(--font-sans); font-size: 14px; transition: transform 0.2s ease; }
.submit:hover .submit-arrow { transform: translateX(4px); }

.examples { margin-top: 80px; text-align: center; }
.examples-label {
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--gray-soft);
  text-transform: uppercase;
  margin-bottom: 20px;
  font-weight: 500;
}
.examples-list {
  display: flex; flex-wrap: wrap; justify-content: center;

  font-family: var(--font-serif);
  font-style: italic;
  font-size: 15px;
  color: var(--gray-warm);
}
.example {
  cursor: pointer;
  border-bottom: 1px dotted var(--gray-ghost);
  padding-bottom: 2px;
  transition: all 0.2s ease;
}
.example:hover { color: var(--brown); border-bottom-color: var(--gold); }

.bottom {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-sans);
  font-size: 10px;
  letter-spacing: 0.18em;

  color: var(--gray-soft);

}

/* ====== Building screen ====== */
.intent-card {
  display: inline-block;
  font-family: var(--font-serif);
  font-style: italic;

.breathe {
  margin: 36px auto 0;

  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;

}
.breathe-line {

}
.breathe-line::after {
  content: ''; position: absolute;
  left: -30%; top: 0; height: 1px;
  width: 30%;
  background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
  animation: drift 3.2s ease-in-out infinite;
}
@keyframes drift {
  0% { left: -30%; }
  100% { left: 100%; }
}
.breathe-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--gold-soft);

}
@keyframes glow {

}
.signature {

}

/* ====== Done screen ====== */

}

}
.result-body {

  font-size: 15px;
  color: var(--brown-soft);

  margin-bottom: 20px;
}
.result-files {
  display: flex; flex-direction: column; gap: 8px;

}
.result-file {
  display: flex; align-items: center; gap: 10px;

}

.result-file-size {
  color: var(--gray-warm);

  letter-spacing: 0.05em;
}
.result-actions {

}
.action {
  font-family: var(--font-sans);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gray-warm);

}

.new-intent {
  margin-top: 24px;

  font-family: var(--font-sans);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gray-warm);
  font-weight: 500;
  cursor: pointer;
  transition: color 0.2s;
}
.new-intent:hover { color: var(--gold); }
.new-intent-arrow {
  font-family: var(--font-serif);
  font-size: 16px;
  transition: transform 0.2s;
}
.new-intent:hover .new-intent-arrow { transform: translateX(3px); }

    <div class="intent-card rise rise-1">a small tool that organizes my photos by season</div>

    <div class="eyebrow rise rise-2">In the studio</div>

      Working on it<span class="italic">.</span>

    </div>

<script>
/* ==========================================================================
   Renzo — Page-turn motion, suggestion fill, rise-on-load
   ========================================================================== */

// Apply rise animations to elements with .rise class
document.querySelectorAll('.rise').forEach((el, i) => {
  const d = el.dataset.rise || (i + 1);
  el.style.animationDelay = (d * 0.1) + 's';
});

// Suggestion auto-fill (on the first-visit page)
document.querySelectorAll('.e-suggestion[data-fill]').forEach(btn => {
  btn.addEventListener('click', () => {
    const fill = btn.dataset.fill;
    if (!fill) return;
    sessionStorage.setItem('renzo-fill', fill);
    window.location.href = 'home-standalone.html';
  });
});

// On the home page, check for the suggested fill
if (document.querySelector('.field-input') && sessionStorage.getItem('renzo-fill')) {
  const fill = sessionStorage.getItem('renzo-fill');
  const input = document.querySelector('.field-input');
  if (input) {
    input.value = fill;
    input.focus();
    input.setSelectionRange(fill.length, fill.length);
  }
  sessionStorage.removeItem('renzo-fill');
}

// Page-turn transitions on internal navigation
document.querySelectorAll('a[href]').forEach(link => {
  const href = link.getAttribute('href');
  if (!href || href.startsWith('http') || href.startsWith('#') || href.startsWith('mailto')) return;
  if (link.target === '_blank') return;
  link.addEventListener('click', (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    document.body.classList.add('page-turn-out');
    setTimeout(() => { window.location.href = href; }, 420);
  });
});

// Initial fade-in
document.body.classList.add('page-turn-in');

// Building screen → done screen transition
if (window.location.pathname.includes('building')) {
  setTimeout(() => {
    document.body.style.transition = 'opacity 0.8s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { window.location.href = 'done-standalone.html'; }, 800);
  }, 5500);
}

</script>
